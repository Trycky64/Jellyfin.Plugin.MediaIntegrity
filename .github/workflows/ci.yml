name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.MediaIntegrity.sln
      - name: Verify formatting
        run: dotnet format Jellyfin.Plugin.MediaIntegrity.sln --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build Jellyfin.Plugin.MediaIntegrity.sln -c Release --no-restore
      - name: Test Release
        run: dotnet test Jellyfin.Plugin.MediaIntegrity.sln -c Release --no-build --logger trx
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test configuration JavaScript
        run: node scripts/test-ui.cjs
      - name: Build Pi validation harness
        run: dotnet build tests/PiValidation/PiValidation.csproj -c Release
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: media-integrity-plugin
          path: artifacts/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
